<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>APK Sentinel</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><div class="eyebrow">DEFENSIVE MOBILE SECURITY</div><h1>APK Sentinel</h1><p>Static APK triage for samples you own or are authorized to inspect.</p></header>
    <section class="notice"><strong>Safety boundary:</strong> This tool never installs or executes an APK. Use only in an isolated, authorized lab.</section>
    <form id="uploadForm" class="card"><label for="apk">Choose an APK</label><input id="apk" name="apk" type="file" accept=".apk" required><button type="submit">Analyze safely</button><p id="status" class="muted"></p></form>
    <section id="report" class="hidden"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
